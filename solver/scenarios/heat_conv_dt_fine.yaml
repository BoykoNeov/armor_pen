# The TIMESTEP control for the jet grid-resolution study — milestone 16.
# Scenarios are DATA, not code (CLAUDE.md §9). Representative / illustrative
# order-of-magnitude values, not any real system (CLAUDE.md §10).
#
# WHY THIS EXISTS. `heat_conv_dx250` / `heat_conv_dx188` refine `grid_resolution`,
# but the substep is CFL-bound — dt ~ dx — so refining the grid refines the CLOCK
# with it: the ladder runs 110 / 171 / 228 substeps per frame. Any difference it
# measures is therefore attributable to (dx AND dt) jointly, and PHYSICS §3.5 has
# already documented that this solver's jet-tip state is dt-sensitive on its own
# (tip J moved +8.7 % from 98 to 240 substeps). A grid study that never separates
# the two is asserting the attribution it should be measuring.
#
# THE ISOLATION IS THE DECK dt, NOT THE CFL MARGIN. `bake` takes
# `min(deck_dt, cfl_dt)`, so a deck dt BELOW the CFL bound simply wins and the
# substep shrinks with nothing else moving. The obvious alternative — raising this
# deck's `cfl_p_margin` — would work through the EOS design state instead, and
# PHYSICS §3.11 is explicit that pushing the design J down re-creates milestone
# 14's own defect (the bound gets read off the pole guard's extrapolated backstop).
# Do not "fix" this deck by reaching for the margin.
#
#   grid_resolution 768, 110 substeps  -> `heat_vs_composite`  (the shipped arm)
#   grid_resolution 768, 230 substeps  -> this deck            (dt alone, ~2.1x)
#   grid_resolution 1600, 228 substeps -> `heat_conv_dx188`    (dx AND dt)
#
# So this deck carries the 16-cell arm's TEMPORAL resolution at the shipped arm's
# SPATIAL resolution. Whatever it fails to reproduce of the refinement effect is
# the part that is genuinely about cells across the jet.
name: heat_conv_dt_fine

domain: { xmin: 0, xmax: 300, ymin: 0, ymax: 120 }   # mm — identical to the shipped deck

projectile:
  kind: heat_jet
  material: copper_jet
  length: 120.0
  diameter: 3.0
  velocity: 7000
  tail_velocity: 2000
  angle_deg: 0.0
  nose_shape: blunt

armor:
  - { material: rha,     thickness: 10.0 }                 # front plate   x=150..160
  - { material: ceramic, thickness: 25.0, standoff: 30.0 } # spaced ceramic x=190..215
  - { material: rha,     thickness: 20.0 }                 # backing plate x=215..235

solver:
  grid_resolution: 768   # UNCHANGED from the shipped deck — dx = 0.3906 mm, 7.5 cells
  # THE VARIABLE. Below the CFL bound (1.818e-9 s here), so `min(deck_dt, cfl_dt)`
  # takes this and the bake runs 230 substeps/frame instead of 110.
  dt: 8.7e-10
  particles_per_cell: 4
  total_time: 3.0e-5
  frame_count: 150    # frame_dt = 2.0e-7 s — the shipped cadence, kept so the arms align
